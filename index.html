y.classList.add('changing');\n  }\n  tech.dataset.stage = String(index);\n  const visual = document.querySelector('.tech-visual');\n  if (visual) {\n    visual.classList.remove('stage-shift');\n    void visual.offsetWidth;\n    visual.classList.add('stage-shift');\n  }\n}\nfunction applyTimelineProgress(progress) {\n  timelineProgress = clamp01(progress);\n  const nextStage = timelineProgress < .34 ? 0 : timelineProgress < .69 ? 1 : 2;\n  setStage(nextStage);\n  if (tech) tech.style.setProperty('--tech-progress', timelineProgress.toFixed(4));\n}\nfunction cancelAutoplay() {\n  if (autoFrame) cancelAnimationFrame(autoFrame);\n  autoFrame = 0;\n  if (tech) delete tech.dataset.autoplaying;\n}\nfunction rawSectionScrollProgress() {\n  if (!tech) return 0;\n  const sticky = document.querySelector('.tech-sticky');\n  const isPinned = sticky && getComputedStyle(sticky).position === 'sticky';\n  const stickyHeight = isPinned ? sticky.getBoundingClientRect().height : 0;\n  // Reserve the header clearance. The pinned panel releases only after Act 03\n  // has had its own stable viewing window, before the next section enters.\n  const releaseBuffer = isPinned ? headerHeight() : 0;\n  const range = Math.max(tech.offsetHeight - stickyHeight - releaseBuffer, 1);\n  return clamp01((headerHeight() - tech.getBoundingClientRect().top) / range);\n}\nfunction sectionScrollProgress() {\n  // 4.2.7: slightly shorter initial dwell, a clear middle hold and a generous\n  // final window so Act 03 remains readable before Horizon is released.\n  const raw = rawSectionScrollProgress();\n  const smooth = value => value * value * (3 - 2 * value);\n  if (raw <= 0.10) return 0;\n  if (raw < 0.32) return smooth((raw - 0.10) / 0.22) * 0.34;\n  if (raw <= 0.50) return 0.50;\n  if (raw < 0.72) return 0.50 + smooth((raw - 0.50) / 0.22) * 0.50;\n  return 1;\n}\nfunction handOffToScroll() {\n  if (timelineMode !== 'auto') return;\n  cancelAutoplay();\n  timelineMode = 'scroll';\n  handoffSectionProgress ame = requestAnimationFrame(tickAutoplay);\n}\nstepButtons.forEach(button => button.addEventListener('click', () => {\n  const index = Number(button.dataset.step);\n  if (!Number.isInteger(index) || index < 0 || index > 2) return;\n  applyTimelineProgress(index / 2);\n  timelineMode = 'scroll';\n  handoffSectionProgress = sectionScrollProgress();\n  handoffProgress = timelineProgress;\n  if (tech) tech.dataset.control = 'scroll';\n}));\nfunction updateVisibleContent() {\n  updateVisionTechnologyTransition();\n  document.querySelectorAll('.reveal:not(.visible)').forEach(element => {\n    const rect = element.getBoundingClientRect();\n    if (rect.top < innerHeight * .92 && rect.bottom > 0) element.classList.add('visible');\n  });\n  const max = document.documentElement.scrollHeight - innerHeight;\n  const progress = document.querySelector('.reading-progress');\n  if (progress) progress.style.width = `${max > 0 ? scrollY / max * 100 : 0}%`;\n  if (!reduced.matches) {\n    const art = document.querySelector('.hero-art');\n    if (art) art.style.transform = `translateY(${Math.min(scrollY, 1000) * .17}px) rotate(${Math.min(scrollY, 1000) * .004}deg)`;\n    document.querySelectorAll('.product-illustration').forEach(visual => {\n      const rect = visual.getBoundingClientRect();\n      const inViewport = rect.bottom > 0 && rect.top < innerHeight;\n      visual.classList.toggle('product-motion-active', inViewport);\n      const relative = (innerHeight * .54 - (rect.top + rect.height * .5)) / Math.max(1, innerHeight + rect.height);\n      const shift = Math.max(-9, Math.min(9, relative * 20));\n      visual.style.setProperty('--product-scroll-y', `${shift.toFixed(1)}px`);\n    });\n  }\n  if (reduced.matches) {\n    document.querySelectorAll('.product-illustration').forEach(visual => visual.classList.remove('product-motion-active'));\n  }\n  if (timelineMode === 'scroll') updateManualProgress();\n  scrollScheduled = false;\n}\nlet lastScrollIntentAt = 0;\nfunction isTechnologyInView() {\n  if (!tech) return false;\n  const rect = tech.getBoundingClientRect();\n  return rect.top < innerHeight * .92 && rect.bottom > headerHeight() + 8;\n}\nfunction registerScrollIntent() {\n  lastScrollIntentAt = performance.now();\n  if (timelineMode === 'auto' && isTechnologyInView() && performance.now() - autoStartedAt > 260) handOffToScroll();\n}\naddEventListener('wheel', registerScrollIntent, {passive:true});\naddEventListener('touchmove', registerScrollIntent, {passive:true});\naddEventListener('keydown', event => {\n  if (['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' '].includes(event.key) && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(event.target.tagName)) registerScrollIntent();\n});\naddEventListener('pointerdown', event => {\n  if (event.clientX >= document.documentElement.clientWidth - 12) registerScrollIntent();\n}, {passive:true});\naddEventListener('scroll', () => {\n  const moved = Math.abs(window.scrollY - previousScrollY) > 1.5;\n  previousScrollY = window.scrollY;\n  const now = performance.now();\n  const recentIntent = lastScrollIntentAt >= autoStartedAt - 180 && now - lastScrollIntentAt < 950;\n  if (moved && tech && timelineMode === 'auto' && isTechnologyInView() && now - autoStartedAt > 300 && recentIntent) handOffToScroll();\n  if (!scrollScheduled) {\n    requestAnimationFrame(updateVisibleContent);\n    scrollScheduled = true;\n  }\n}, {passive:true});\naddEventListener('resize', () => {\n  if (!scrollScheduled) {\n    requestAnimationFrame(updateVisibleContent);\n    scrollScheduled = true;\n  }\n});\nupdateVisibleContent();\nlet technologyInViewport = false;\nif (tech && !reduced.matches && 'IntersectionObserver' in window) {\n  const techEntryObserver = new IntersectionObserver(entries => {\n    entries.forEach(entry => {\n      technologyInViewport = entry.isIntersecting;\n      tech.classList.toggle('tech-visual-active', technologyInViewport);\n      if (technologyInViewport) {\n        if (timelineMode === 'idle') startAutoplay();\n        else if (timelineMode === 'paused') resumeAutoplay();\n      } else if (timelineMode === 'auto') {\n        // Pause off-screen so the sequence does not finish unseen. Resume at the same frame.\n        pauseAutoplay();\n      }\n    });\n  }, {threshold:.08, rootMargin:'0px 0px -8% 0px'});\n  techEntryObserver.observe(tech);\n} else if (tech && !reduced.matches) {\n  technologyInViewport = true;\n  startAutoplay();\n}\ndocument.addEventListener('visibilitychange', () => {\n  if (document.hidden && timelineMode === 'auto') pauseAutoplay();\n  else if (!document.hidden && technologyInViewport && timelineMode === 'paused') resumeAutoplay();\n});\nconst horizonGrid = document.querySelector('.possibility-grid');\nif (horizonGrid && 'IntersectionObserver' in window) {\n  const horizonObserver = new IntersectionObserver(entries => {\n    if (entries.some(entry => entry.isIntersecting)) {\n      horizonGrid.classList.add('horizon-active');\n      horizonObserver.disconnect();\n    }\n  }, {threshold:.12});\n  horizonObserver.observe(horizonGrid);\n}\n// 4.3.0: Fire the optical pass only when the Vision section itself is centered in the viewport.\nconst visionLightWord = document.querySelector('.light-word');\nconst visionSection = visionLightWord && visionLightWord.closest('.vision');\nif (visionLightWord && visionSection && !reduced.matches) {\n  let visionLightPlayed = false;\n  let visionCenterCheckQueued = false;\n  const playVisionLight = () => {\n    if (visionLightPlayed) return;\n    visionLightPlayed = true;\n    visionLightWord.classList.remove('light-word-active');\n    void visionLightWord.offsetWidth;\n    visionLightWord.classList.add('light-word-active');\n    window.setTimeout(() => visionLightWord.classList.remove('light-word-active'), 1500);\n    window.removeEventListener('scroll', checkVisionCenter);\n    window.removeEventListener('resize', checkVisionCenter);\n  };\n  const checkVisionCenter = () => {\n    if (visionLightPlay
